<div id="panel-chat-contenedor" class="flex flex-col h-full" hx-ext="ws">
    <div class="p-4 bg-white border-b border-gray-200 flex justify-between items-center shadow-sm">
        <div>
            <h3 class="font-bold text-gray-800">Cliente: {{ usuario.telegram_id }}</h3>
            <p class="text-xs text-gray-500">Estado: {{ usuario.estado_conversacion }}</p>
        </div>

        <form hx-post="/admin/conversaciones/intervenir/{{ usuario.id }}" hx-target="#panel-chat-derecho">
            <button type="submit" class="px-4 py-2 text-sm rounded shadow transition font-medium
                {{ 'bg-red-600 hover:bg-red-700 text-white' if not usuario.esta_intervenido else 'bg-green-600 hover:bg-green-700 text-white' }}">
                {{ '⛔ Pausar Asistente IA' if not usuario.esta_intervenido else '🤖 Reactivar Asistente IA' }}
            </button>
        </form>
    </div>

    <div id="contenedor-mensajes-lista" 
         class="flex-1 overflow-y-auto p-4 space-y-3"
         hx-get="/admin/conversaciones/mensajes/{{ usuario.id }}"
         hx-trigger="load"
         hx-swap="innerHTML">
        {% include 'mensajes_lista.html' %}
        <div id="final-del-chat"></div>
    </div>

    <script>
        (function() {
            const container = document.getElementById('panel-chat-contenedor');
            const listContainer = document.getElementById('contenedor-mensajes-lista');
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            const wsUrl = protocol + window.location.host + '/admin/ws/chat_{{ usuario.id }}';
            
            if (container) {
                container.setAttribute('ws-connect', wsUrl);
                htmx.process(container);
            }

            const forceScrollBottom = () => {
                if (!listContainer) return;
                // Fuerza bruta: Al final absoluto instantáneamente
                listContainer.scrollTop = listContainer.scrollHeight;
            };

            // Ejecutar al terminar cualquier swap de HTMX (mensajes nuevos)
            document.body.addEventListener('htmx:afterSettle', function(evt) {
                if (evt.detail.target.id === 'contenedor-mensajes-lista') {
                    forceScrollBottom();
                }
            });

            // Observador de mutaciones para inyecciones WebSocket OOB
            const observer = new MutationObserver(() => {
                forceScrollBottom();
                // Reintento por si hay imágenes o carga lenta
                setTimeout(forceScrollBottom, 50);
            });

            if (listContainer) {
                observer.observe(listContainer, { childList: true, subtree: true });
                // Scroll inicial
                setTimeout(forceScrollBottom, 50);
            }

            document.body.addEventListener('htmx:wsError', function(evt) {
                console.error('WebSocket Error:', evt);
                setTimeout(() => htmx.trigger('#contenedor-mensajes-lista', 'load'), 5000);
            });
        })();
    </script>


<div class="p-4 bg-white border-t border-gray-200">
    <form hx-post="/admin/conversaciones/enviar-mensaje" 
          hx-target="#panel-chat-derecho" 
          hx-indicator="#loading-spinner"
          hx-on::after-request="if(event.detail.successful) this.reset()"
          class="flex space-x-2">
        <input type="hidden" name="chat_id" value="{{ usuario.telegram_id }}">
        <input type="text" name="mensaje" id="input-mensaje" placeholder="Escribe un mensaje directo a Telegram..." required
               class="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit" class="bg-gray-800 text-white px-4 py-2 text-sm rounded-lg hover:bg-gray-900 transition font-medium flex items-center disabled:opacity-50">
            <span class="htmx-indicator-hide">Enviar</span>
            <svg id="loading-spinner" class="animate-spin h-4 w-4 ml-2 htmx-indicator" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" style="display: none;">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>
    </form>
</div>

<style>
    .htmx-request .htmx-indicator-hide { display: none; }
    .htmx-request #loading-spinner { display: inline !important; }
</style>
