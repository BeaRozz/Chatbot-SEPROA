{% for usuario in usuarios %}
<div id="usuario-fila-{{ usuario.id }}" 
     class="p-4 border-b border-gray-100 hover:bg-gray-50 transition cursor-pointer flex justify-between items-center relative group usuario-sidebar-item"
     hx-get="/admin/conversaciones/detalle/{{ usuario.id }}" 
     hx-target="#panel-chat-derecho"
     hx-swap="innerHTML"
     hx-indicator="#loading-sidebar-{{ usuario.id }}"
     onclick="desactivarOtrosItems(this)">

    <div class="flex-1 min-w-0 mr-2">
        <p class="font-medium text-gray-800 truncate">ID: {{ usuario.telegram_id }}</p>
        <p class="text-xs text-gray-500 truncate italic">Ver conversación...</p>
    </div>

    <div class="flex items-center space-x-2">
        <div id="loading-sidebar-{{ usuario.id }}" class="htmx-indicator">
            <svg class="animate-spin h-4 w-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-opacity-10 
                     {{ 'bg-green-100 text-green-800' if not usuario.esta_intervenido else 'bg-red-100 text-red-800' }}">
            ● {{ 'IA' if not usuario.esta_intervenido else 'Humano' }}
        </span>
    </div>
</div>
{% endfor %}
