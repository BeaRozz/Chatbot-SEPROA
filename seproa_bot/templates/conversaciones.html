<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversaciones SEPROA</title>
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/ws.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .usuario-activo {
            background-color: #f0f7ff !important;
            border-left: 4px solid #2563eb !important;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <script>
        function desactivarOtrosItems(elemento) {
            // Quitar clase activo de todos
            document.querySelectorAll('.usuario-sidebar-item').forEach(item => {
                item.classList.remove('usuario-activo');
            });
            // Añadir al seleccionado
            elemento.classList.add('usuario-activo');
        }
    </script>

    <div class="flex h-screen w-full" id="main-layout">
        
        <!-- Sidebar con su propio alcance de WebSocket -->
        <div class="w-1/3 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-4 border-b border-gray-200 bg-gray-800 text-white flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-semibold">Conversaciones SEPROA</h2>
                    <p class="text-xs text-gray-400">Actualización en tiempo real (WS)</p>
                </div>
            </div>

            
            <div id="sidebar-usuarios" 
                 class="flex-1 overflow-y-auto"
                 hx-get="/admin/conversaciones/lista-parcial" 
                 hx-trigger="load, every 5s" 
                 hx-swap="innerHTML">
                <p class="p-4 text-sm text-gray-500 animate-pulse">Cargando bandeja de entrada...</p>
            </div>
        </div>

        <div id="panel-chat-derecho" class="w-2/3 flex flex-col bg-gray-100">
            <div class="flex flex-col items-center justify-center h-full text-gray-400">
                <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                <p class="text-lg">Selecciona un cliente de la lista para gestionar el soporte técnico</p>
            </div>
        </div>
    </div>

    <script>
        // Inicialización manual del WebSocket del Sidebar para evitar errores de ruta
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('sidebar-usuarios');
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            const wsUrl = protocol + window.location.host + '/admin/ws/global';
            sidebar.setAttribute('ws-connect', wsUrl);
            // Procesar el nuevo atributo
            htmx.process(sidebar);
        });
    </script>

</body>
</html>
