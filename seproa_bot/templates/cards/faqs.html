<div class="card shadow-sm mb-4">
    <div class="card-header bg-info text-white">Gestión de FAQs</div>
    <div class="card-body">
        <ul class="list-group mb-3">
            {% for f in faqs %}
            <li class="list-group-item">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <strong>P: {{ f.pregunta }}</strong><br>
                        <small class="text-muted">R: {{ f.respuesta }}</small>
                    </div>
                    <form action="/admin/faqs/delete/{{ f.id }}" method="POST">
                        <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                </div>
            </li>
            {% endfor %}
        </ul>
        <form action="/admin/faqs/add" method="POST" class="row g-2">
            <div class="col-md-5"><input name="pregunta" class="form-control" placeholder="Pregunta" required></div>
            <div class="col-md-5"><input name="respuesta" class="form-control" placeholder="Respuesta" required></div>
            <div class="col-md-2"><button class="btn btn-info text-white w-100">+</button></div>
        </form>
    </div>
</div>
