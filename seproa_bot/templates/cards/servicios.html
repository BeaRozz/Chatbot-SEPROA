<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
    <div class="bg-slate-800 px-6 py-4">
        <h3 class="text-lg font-bold text-white flex items-center">
            <svg class="w-5 h-5 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            Catálogo de Servicios
        </h3>
    </div>
    <div class="p-6 flex-1 overflow-y-auto">
        <div class="space-y-3 mb-6">
            {% for s in servicios %}
            <div class="flex justify-between items-start p-3 bg-gray-50 rounded-lg border border-gray-100 hover:border-blue-200 transition-colors group">
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-gray-800 text-sm">{{ s.nombre }}</p>
                    <p class="text-xs text-gray-600 leading-relaxed">{{ s.descripcion }}</p>
                </div>
                <form action="/admin/servicios/delete/{{ s.id }}" method="POST" class="ml-2">
                    <button type="submit" class="text-gray-400 hover:text-red-600 p-1 rounded-md hover:bg-red-50 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </form>
            </div>
            {% endfor %}
        </div>
    </div>
    <div class="p-6 bg-gray-50 border-t border-gray-200">
        <form action="/admin/servicios/add" method="POST" class="space-y-3">
            <input name="nombre" placeholder="Nombre del servicio" required 
                   class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm">
            <div class="flex space-x-2">
                <input name="descripcion" placeholder="Descripción breve" required 
                       class="flex-1 rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm">
                <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 shadow-md font-bold">+</button>
            </div>
        </form>
    </div>
</div>
