<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-6">
    <div class="bg-gray-50 border-b border-gray-200 px-6 py-4">
        <h3 class="text-lg font-bold text-gray-800 flex items-center">
            <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.756 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.756 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.756 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            Configuración e Identidad General
        </h3>
    </div>
    <div class="p-6">
        <form action="/admin/config/save" method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

                <!-- Columna 1: Personalidad -->
                <div class="space-y-4 pr-0 md:pr-8 md:border-r border-gray-100">
                    <h4 class="text-sm font-bold text-blue-600 uppercase tracking-wider">🤖 Personalidad y Mensajes</h4>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Tono de voz de la IA</label>
                        <select name="tono_id" id="tonoSelect" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm">
                            {% for t in tonos %}
                                <option value="{{ t.id }}" data-desc="{{ t.descripcion }}" 
                                        {% if config.tono_id == t.id %}selected{% endif %}>
                                    {{ t.etiqueta }}
                                </option>
                            {% endfor %}
                        </select>
                        <div class="mt-2 p-3 bg-blue-50 border border-blue-100 rounded-lg text-xs text-blue-800">
                            <strong>Directriz: </strong><span id="tonoDesc"></span>
                        </div>
                    </div>

                    <div class="flex items-center">
                        <input type="checkbox" name="usa_emojis" id="usa_emojis" value="true" 
                               {% if config.usa_emojis %}checked{% endif %}
                               class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <label for="usa_emojis" class="ml-2 block text-sm font-medium text-gray-700">
                            Permitir que la IA use Emojis
                        </label>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Mensaje de Bienvenida</label>
                        <textarea name="mensaje_saludo" rows="2" required 
                                  class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm"
                                  placeholder="¡Hola! ¿En qué puedo ayudarte?">{{ config.mensaje_saludo if config else '' }}</textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Mensaje de Despedida</label>
                        <textarea name="mensaje_despedida" rows="2" required 
                                  class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm"
                                  placeholder="Gracias por contactarnos.">{{ config.mensaje_despedida if config else '' }}</textarea>
                    </div>
                </div>

                <!-- Columna 2: Datos de Contacto -->
                <div class="space-y-4">
                    <h4 class="text-sm font-bold text-amber-600 uppercase tracking-wider">📅 Estado y Datos de Contacto</h4>

                    <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl space-y-3">
                        <div class="flex items-center justify-between">
                            <label for="modo_vacaciones" class="text-sm font-bold text-amber-900 flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-7h1m-1 4h1m4-4h1m-1 4h1"></path></svg>
                                Modo Vacaciones
                            </label>
                            <div class="relative inline-block w-10 mr-2 align-middle select-none">
                                <input type="checkbox" name="modo_vacaciones" id="modo_vacaciones" value="true" 
                                       {% if config.modo_vacaciones %}checked{% endif %}
                                       class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                                <label for="modo_vacaciones" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                            </div>
                        </div>
                        <div id="div_fecha_regreso" class="space-y-1" style="display: {% if config.modo_vacaciones %}block{% else %}none{% endif %};">
                            <label class="block text-xs font-semibold text-amber-800">¿Qué día reabren?</label>
                            <input type="date" id="inputFechaRegreso" name="fecha_regreso" 
                                   class="w-full rounded-lg border-amber-300 shadow-sm focus:border-amber-500 focus:ring-amber-500 text-sm"
                                   value="{{ config.fecha_regreso }}">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Teléfono</label>
                            <input type="text" name="telefono_contacto" required value="{{ config.telefono_contacto if config else '' }}"
                                   class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Correo Corporativo</label>
                            <input type="email" name="correo_contacto" required value="{{ config.correo_contacto if config else '' }}"
                                   class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Dirección Física</label>
                            <textarea name="ubicacion_contacto" rows="2" required
                                      class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm">{{ config.ubicacion_contacto if config else '' }}</textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pt-4 border-t border-gray-100 text-center">
                <button type="submit" id="btnGuardarGral" class="w-full md:w-auto px-12 py-3 bg-blue-600 text-white rounded-xl shadow-lg hover:bg-blue-700 transition-all font-bold">
                    💾 Guardar Cambios Generales
                </button>
            </div>
        </form>
    </div>
</div>

<style>
    /* Estilo para el toggle switch de vacaciones */
    .toggle-checkbox:checked { right: 0; border-color: #f59e0b; }
    .toggle-checkbox:checked + .toggle-label { background-color: #f59e0b; }
    .toggle-checkbox { right: 4px; transition: all 0.3s; border-color: #d1d5db; top: 0; }
    .toggle-label { transition: background-color 0.3s; }
</style>

<script>
    (function() {
        const toggleVacaciones = document.getElementById('modo_vacaciones');
        const divFecha = document.getElementById('div_fecha_regreso');
        const inputFecha = document.getElementById('inputFechaRegreso');
        const btnGuardar = document.getElementById('btnGuardarGral');

        function validarVacaciones() {
            if (toggleVacaciones.checked) {
                divFecha.style.display = 'block';
                inputFecha.setAttribute('min', new Date().toISOString().split('T')[0]);

                if (!inputFecha.value) {
                    btnGuardar.disabled = true;
                    btnGuardar.innerText = "🛑 Selecciona fecha de regreso";
                    btnGuardar.className = "w-full md:w-auto px-12 py-3 bg-gray-400 text-white rounded-xl cursor-not-allowed font-bold";
                } else {
                    btnGuardar.disabled = false;
                    btnGuardar.innerText = "💾 Guardar Cambios Generales";
                    btnGuardar.className = "w-full md:w-auto px-12 py-3 bg-blue-600 text-white rounded-xl shadow-lg hover:bg-blue-700 transition-all font-bold";
                }
            } else {
                divFecha.style.display = 'none';
                btnGuardar.disabled = false;
                btnGuardar.innerText = "💾 Guardar Cambios Generales";
                btnGuardar.className = "w-full md:w-auto px-12 py-3 bg-blue-600 text-white rounded-xl shadow-lg hover:bg-blue-700 transition-all font-bold";
            }
        }

        if(toggleVacaciones && inputFecha) {
            toggleVacaciones.addEventListener('change', validarVacaciones);
            inputFecha.addEventListener('input', validarVacaciones);
            validarVacaciones();
        }

        function updateDesc() {
            const select = document.getElementById('tonoSelect');
            const descSpan = document.getElementById('tonoDesc');
            if(select && select.options[select.selectedIndex]) {
                descSpan.textContent = select.options[select.selectedIndex].getAttribute('data-desc');
            }
        }

        const tonoSelect = document.getElementById('tonoSelect');
        if (tonoSelect) {
            tonoSelect.addEventListener('change', updateDesc);
            updateDesc();
        }
    })();
</script>
